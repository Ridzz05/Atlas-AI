name: ATLAS CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # No `version:` input on purpose: pnpm/action-setup then defers to the
        # `packageManager` field in package.json, which is the single source of truth.
        # Pinning `version: 11` here conflicted with `pnpm@11.23.0` there.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Dependency signature audit
        run: pnpm audit signatures

      - name: Secret scan
        run: |
          echo "Scanning for accidental secret commits..."
          node scripts/check-secrets.mjs
          echo "Secret scan passed"

      - name: Lint source files
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm test

      - name: Production Build
        run: pnpm build

      - name: Validate production Compose configuration
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          API_AUTH_TOKEN: ci-api-auth-token-32-characters-long
          ENCRYPTION_KEY: ci-encryption-key-32-characters-long
          TELEGRAM_BOT_TOKEN: ci-telegram-token
          TELEGRAM_ALLOWED_USER_IDS: '1'
          MODEL_PROVIDER: openai
          MODEL_API_KEY: ci-model-api-key
          ATLAS_BASIC_AUTH_USER: ci-operator
          ATLAS_BASIC_AUTH_HASH: '$2b$10$.N7ued2ENxJveCUeoXijCufvA3w0bPhvs90bIpR6UBohBG53l9PMy'
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Validate operational shell scripts
        run: |
          for script in scripts/backup-db.sh scripts/restore-db.sh scripts/healthcheck.sh scripts/ci-compose-smoke.sh; do
            bash -n "$script"
          done

  compose-smoke:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Compose boot, readiness, and backup/restore smoke test
        run: bash scripts/ci-compose-smoke.sh
