services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ${ATLAS_CONTAINER_PREFIX:-atlas}_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas_os}
      POSTGRES_USER: ${POSTGRES_USER:-atlas_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-atlas_admin} -d ${POSTGRES_DB:-atlas_os}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'

  redis:
    image: redis:7-alpine
    container_name: ${ATLAS_CONTAINER_PREFIX:-atlas}_redis_prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set} --appendonly yes
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:?REDIS_PASSWORD must be set}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'

  agent-service:
    build:
      context: .
      dockerfile: apps/agent-service/Dockerfile
    container_name: ${ATLAS_CONTAINER_PREFIX:-atlas}_agent_service_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?API_AUTH_TOKEN must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas_admin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-atlas_os}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      MODEL_PROVIDER: ${MODEL_PROVIDER:?MODEL_PROVIDER must be set}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      ARTIFACT_STORAGE_PATH: /app/data/artifacts
      GLOBAL_DAILY_BUDGET_USD: ${GLOBAL_DAILY_BUDGET_USD:-5}
      MAX_CONCURRENT_AGENT_RUNS: ${MAX_CONCURRENT_AGENT_RUNS:-3}
      MAX_DELEGATION_DEPTH: ${MAX_DELEGATION_DEPTH:-2}
      EXTERNAL_WRITES_ENABLED: ${EXTERNAL_WRITES_ENABLED:-false}
    volumes:
      - artifacts_prod_data:/app/data/artifacts
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: ${ATLAS_CONTAINER_PREFIX:-atlas}_worker_prod
    restart: always
    environment:
      NODE_ENV: production
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?API_AUTH_TOKEN must be set}
      WORKER_HEALTH_PORT: 8081
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas_admin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-atlas_os}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      MODEL_PROVIDER: ${MODEL_PROVIDER:?MODEL_PROVIDER must be set}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      RESEARCH_PROVIDER: ${RESEARCH_PROVIDER:-none}
      RESEARCH_API_KEY: ${RESEARCH_API_KEY:-}
      RESEARCH_COUNTRY: ${RESEARCH_COUNTRY:-ID}
      RESEARCH_SEARCH_LANG: ${RESEARCH_SEARCH_LANG:-id}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      ARTIFACT_STORAGE_PATH: /app/data/artifacts
      MEMORY_MAINTENANCE_INTERVAL_SECONDS: ${MEMORY_MAINTENANCE_INTERVAL_SECONDS:-3600}
      QUEUE_RECOVERY_INTERVAL_SECONDS: ${QUEUE_RECOVERY_INTERVAL_SECONDS:-30}
      SCHEDULED_JOB_SYNC_INTERVAL_SECONDS: ${SCHEDULED_JOB_SYNC_INTERVAL_SECONDS:-30}
      SCHEDULED_JOB_TICK_INTERVAL_SECONDS: ${SCHEDULED_JOB_TICK_INTERVAL_SECONDS:-60}
      WORKFLOW_RESUME_INTERVAL_SECONDS: ${WORKFLOW_RESUME_INTERVAL_SECONDS:-30}
      AUTOMATION_ENABLED: ${AUTOMATION_ENABLED:-true}
      WORKFLOW_AUTOMATION_ENABLED: ${WORKFLOW_AUTOMATION_ENABLED:-true}
      MEMORY_DELETION_GRACE_DAYS: ${MEMORY_DELETION_GRACE_DAYS:-7}
      GLOBAL_DAILY_BUDGET_USD: ${GLOBAL_DAILY_BUDGET_USD:-5}
      MAX_CONCURRENT_AGENT_RUNS: ${MAX_CONCURRENT_AGENT_RUNS:-3}
      MAX_DELEGATION_DEPTH: ${MAX_DELEGATION_DEPTH:-2}
      EXTERNAL_WRITES_ENABLED: ${EXTERNAL_WRITES_ENABLED:-false}
    volumes:
      - artifacts_prod_data:/app/data/artifacts
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8081/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'

  # Full AI Automation dedicated worker — scales horizontally with `worker` (same image, distinct lease).
  # Follows identical workflow (TaskRepo -> Queue -> Delegator -> Specialists -> QA) but can be scaled
  # independently via ATLAS_AUTOMATION_REPLICAS for high-volume cron/workflow automation.
  worker-automation:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: ${ATLAS_CONTAINER_PREFIX:-atlas}_worker_automation_prod
    restart: always
    environment:
      NODE_ENV: production
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?API_AUTH_TOKEN must be set}
      WORKER_HEALTH_PORT: 8081
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas_admin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-atlas_os}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      MODEL_PROVIDER: ${MODEL_PROVIDER:?MODEL_PROVIDER must be set}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      RESEARCH_PROVIDER: ${RESEARCH_PROVIDER:-none}
      RESEARCH_API_KEY: ${RESEARCH_API_KEY:-}
      RESEARCH_COUNTRY: ${RESEARCH_COUNTRY:-ID}
      RESEARCH_SEARCH_LANG: ${RESEARCH_SEARCH_LANG:-id}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      ARTIFACT_STORAGE_PATH: /app/data/artifacts
      MEMORY_MAINTENANCE_INTERVAL_SECONDS: ${MEMORY_MAINTENANCE_INTERVAL_SECONDS:-3600}
      QUEUE_RECOVERY_INTERVAL_SECONDS: ${QUEUE_RECOVERY_INTERVAL_SECONDS:-30}
      SCHEDULED_JOB_SYNC_INTERVAL_SECONDS: ${SCHEDULED_JOB_SYNC_INTERVAL_SECONDS:-30}
      SCHEDULED_JOB_TICK_INTERVAL_SECONDS: ${SCHEDULED_JOB_TICK_INTERVAL_SECONDS:-60}
      WORKFLOW_RESUME_INTERVAL_SECONDS: ${WORKFLOW_RESUME_INTERVAL_SECONDS:-30}
      AUTOMATION_ENABLED: ${AUTOMATION_ENABLED:-true}
      WORKFLOW_AUTOMATION_ENABLED: ${WORKFLOW_AUTOMATION_ENABLED:-true}
      MEMORY_DELETION_GRACE_DAYS: ${MEMORY_DELETION_GRACE_DAYS:-7}
      GLOBAL_DAILY_BUDGET_USD: ${GLOBAL_DAILY_BUDGET_USD:-5}
      MAX_CONCURRENT_AGENT_RUNS: ${MAX_CONCURRENT_AGENT_RUNS:-3}
      MAX_DELEGATION_DEPTH: ${MAX_DELEGATION_DEPTH:-2}
      EXTERNAL_WRITES_ENABLED: ${EXTERNAL_WRITES_ENABLED:-false}
    volumes:
      - artifacts_prod_data:/app/data/artifacts
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8081/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'
    profiles: ['automation']

  telegram-bot:
    build:
      context: .
      dockerfile: apps/telegram-bot/Dockerfile
    container_name: ${ATLAS_CONTAINER_PREFIX:-atlas}_telegram_bot_prod
    restart: always
    environment:
      NODE_ENV: production
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?API_AUTH_TOKEN must be set}
      TELEGRAM_HEALTH_PORT: 8082
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be set}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:?TELEGRAM_ALLOWED_USER_IDS must be set}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-atlas_admin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-atlas_os}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      MODEL_PROVIDER: ${MODEL_PROVIDER:?MODEL_PROVIDER must be set}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8082/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: ${ATLAS_CONTAINER_PREFIX:-atlas}_dashboard_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost/api}
      ATLAS_API_BASE_URL: http://agent-service:4000/api/v1
      ATLAS_API_AUTH_TOKEN: ${API_AUTH_TOKEN:?API_AUTH_TOKEN must be set}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      agent-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'

  caddy:
    image: caddy:2-alpine
    container_name: ${ATLAS_CONTAINER_PREFIX:-atlas}_caddy_prod
    restart: always
    environment:
      ATLAS_DOMAIN: ${ATLAS_DOMAIN:-localhost}
      # Mandatory: the dashboard proxy injects the real API bearer token, so reaching the
      # dashboard is equivalent to operator credentials. Generate the hash with
      # `docker run --rm caddy:2-alpine caddy hash-password --plaintext 'your-password'`.
      ATLAS_BASIC_AUTH_USER: ${ATLAS_BASIC_AUTH_USER:?Set ATLAS_BASIC_AUTH_USER for the Caddy access gate}
      ATLAS_BASIC_AUTH_HASH: ${ATLAS_BASIC_AUTH_HASH:?Set ATLAS_BASIC_AUTH_HASH (caddy hash-password) for the Caddy access gate}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--header', 'Host: ${ATLAS_DOMAIN:-localhost}', '--spider', 'http://127.0.0.1/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      dashboard:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  postgres_prod_data:
  redis_prod_data:
  caddy_data:
  caddy_config:
  artifacts_prod_data:
